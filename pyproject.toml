[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prefect-mlflow-demo"
version = "0.1.0"
description = "Iris machine-learning pipeline orchestrated with Prefect and tracked with MLflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow==3.17.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "prefect==3.8.8",
    "scikit-learn>=1.5.0",
]

[project.scripts]
prefect-mlflow-run = "prefect_mlflow_demo.main_flow:main"
prefect-mlflow-deploy = "prefect_mlflow_demo.deploy:main"

[tool.setuptools.packages.find]
where = ["src"]
